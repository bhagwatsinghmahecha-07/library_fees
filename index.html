<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Library Fees</title>
    <style>
      html,body{margin:0;background:#14213d}
      #splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#14213d;color:#fff;font:700 22px system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
      #splash .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
      #splash button{font:700 16px system-ui,sans-serif;padding:10px 16px;border-radius:8px;border:0}
      @keyframes sp{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body class="bg-slate-100 text-ink font-sans">
    <div id="splash"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#5eead4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6c3-1 6-1 9 1v13c-3-2-6-2-9-1zM21 6c-3-1-6-1-9 1v13c3-2 6-2 9-1z"/></svg><div>Library Fees</div><div class="spin"></div></div>
    <div id="root"></div>
    <script>setTimeout(function(){var s=document.getElementById('splash');if(s)s.insertAdjacentHTML('beforeend','<p style="font:400 15px system-ui,sans-serif;margin:0">Still loading. Check your internet.</p><button onclick="location.reload()">Reload</button>')},10000)</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
